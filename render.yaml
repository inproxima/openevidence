# Render Blueprint: one web service (FastAPI serving the built React app) + Postgres.
# Create it once from the Render dashboard (New → Blueprint → this repo); every push to
# main redeploys. Values marked `sync: false` are secrets or per-deployment settings:
# Render asks for them when the Blueprint is created and never reads them from this file.
# See README → "Deploy to Render".
services:
  - type: web
    name: clinical-evidence-ca
    runtime: python
    region: oregon
    plan: 0.5c-512mb # "Starter"
    branch: main
    autoDeployTrigger: commit
    # uv is on the path because uv.lock is at the repo root. VITE_AUTH0_* must be set
    # before this runs: Vite bakes them into the frontend bundle.
    buildCommand: uv sync --frozen --no-dev && cd frontend && npm ci && npm run build
    # --no-sync: don't let `uv run` install the dev group at startup.
    startCommand: uv run --no-sync uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: NODE_VERSION
        value: lts
      - key: DATABASE_URL
        fromDatabase:
          name: clinical-evidence-ca-db
          property: connectionString

      # --- secrets (paste in the dashboard) ---
      - key: OPENAI_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: NCBI_EMAIL
        sync: false

      # --- Auth0 (README → "Auth0 for testers"); VITE_* are read at build time ---
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        sync: false

      # The public URL, e.g. https://clinical-evidence-ca.onrender.com
      - key: CORS_ORIGINS
        sync: false

      # --- non-secret settings (defaults match .env.example) ---
      - key: APP_NAME
        value: Clinical Evidence CA
      - key: REGION_FOCUS
        value: CA
      - key: OPENAI_MODEL
        value: gpt-6.1-sol
      - key: OPENAI_REASONING_EFFORT
        value: medium
      - key: OPENAI_FAST_EFFORT
        value: low
      - key: OPENAI_DEEP_EFFORT
        value: high
      - key: GUIDELINE_SEARCH
        value: openai,serpapi
      - key: NCBI_TOOL
        value: clinical-evidence-ca
      - key: MAX_SOURCES_QUICK
        value: "12"
      - key: MAX_SOURCES_DEEP
        value: "40"
      - key: ASK_LIMIT_PER_MINUTE
        value: "5"
      - key: ASK_LIMIT_PER_DAY
        value: "50"
      - key: ASK_LIMIT_GLOBAL_PER_DAY
        value: "500"
      - key: LLM_MOCK
        value: "false"

databases:
  - name: clinical-evidence-ca-db
    region: oregon
    plan: 0.1c-256mb # "Basic-256mb"
    databaseName: clinical_evidence
    user: clinical_evidence
