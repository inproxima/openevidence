[project]
name = "clinical-evidence-ca"
version = "0.1.0"
description = "Canadian clinical-evidence Q&A: streamed, cited answers from PubMed, Europe PMC, trials, Health Canada and Canadian guidelines."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "httpx>=0.28",
    "openai>=3.31",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
    "pyjwt[crypto]>=2.15",
    "trafilatura>=2.3",
    "sse-starlette>=3.5",
    "psycopg[binary]>=3.2",  # Postgres driver for deployment (DATABASE_URL)
    "pypdf>=6.20",  # text from guideline PDFs
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.uv]
package = false
